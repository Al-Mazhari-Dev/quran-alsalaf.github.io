<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover ليمتد المصحف حافةً إلى حافة تحت النتوء والحواف المنحنية -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F5EDDC" />
    <meta name="description" content="إنشاء: سامي أبصار الإسلام" />

    <!-- تشغيل بملء الشاشة عند التثبيت على آيفون -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="قرآن السلف" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="icons/favicon-64.png" />

    <title>تطبيق قرآن السلف</title>

    <script>
      /*
        المظهر (٢٠٢٦-١١-١١): «خلفية القراءة» و«لون التطبيق». يُطبَّق هنا قبل رسم الصفحة لئلا تومض
        بلونٍ ثم تنقلب إلى آخر، ولهذا هو مكتوب داخل الصفحة لا في ملف يُحمَّل بعدها.

        القائمتان في src/data/appearance.json وحدها، ويحقنها vite.config.js هنا مكان
        __APPEARANCE_DATA__ وقت البناء والتطوير. ولا يُضبط هنا إلا الأساس: الخلفية، ونص المصحف،
        واللون الثانوي بدرجته المناسبة، ونوع الخلفية (data-theme: light أو dark)، ومقادير الاشتقاق؛
        وكل لون فرعي (البطاقات والحدود والنصوص الثانوية والتظليل) يُشتق منها في src/styles/tokens.css.
        ويُحسب هنا ما يحتاج حساب تباين: درجة النص الملوّن، وألوان خط المصحف.

        • أول فتح: «بيج» و«ذهبي عنبري» أيًّا كان وضع الجهاز (فاتحًا أو داكنًا).
        • من اختار سابقًا الوضع الداكن (hq.theme) ينتقل إلى «رصاصي»، والفاتح إلى «بيج».
        • من اختار «موف» (أُزيل) ينتقل إلى «بلا لون».
        • بعدها يبقى اختيار المستخدم هو المعتمد ولو تغيّر إعداد النظام.
        وsrc/lib/appearance.js يستعمل apply نفسها عند التبديل من الإعدادات.
      */
      (function () {
        var DATA = __APPEARANCE_DATA__;
        var BG_KEY = 'hq.bg';
        var ACCENT_KEY = 'hq.accent';

        function find(list, id) {
          for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
          return null;
        }
        function get(key) {
          try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function set(key, value) {
          try { localStorage.setItem(key, value); } catch (e) {}
        }

        // ---- حساب الألوان (sRGB، كما يمزج color-mix في tokens.css) ----
        function rgb(hex) {
          var n = parseInt(hex.slice(1), 16);
          return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        function hex(c) {
          return '#' + c.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join('');
        }
        // b بنسبة p (٠–١٠٠) فوق a
        function mix(a, b, p) {
          return a.map(function (v, i) { return v + (b[i] - v) * p / 100; });
        }
        function lum(c) {
          var l = c.map(function (v) {
            v /= 255;
            return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
          });
          return 0.2126 * l[0] + 0.7152 * l[1] + 0.0722 * l[2];
        }
        function contrast(a, b) {
          var x = lum(a), y = lum(b);
          return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05);
        }

        function apply(bgId, accentId) {
          var bg = find(DATA.backgrounds, bgId) || find(DATA.backgrounds, DATA.defaults.light);
          var accent = find(DATA.accents, accentId) || find(DATA.accents, DATA.defaults.accent);
          var theme = bg.dark ? 'dark' : 'light';
          // مقادير الاشتقاق، وللّون أن يعدّل بعضها لنفسه («بلا لون»: تظليل رمادي أخفّ من الملوَّن،
          // لأن لون نص المصحف أشد تباينًا مع الخلفية من أي لون، فيبقى نص الآية الجارية مقروءًا فوقه)
          var k = {};
          for (var m in DATA.mix[theme]) k[m] = DATA.mix[theme][m];
          if (accent.mix && accent.mix[theme]) for (var o in accent.mix[theme]) k[o] = accent.mix[theme][o];
          var root = document.documentElement;
          // «بلا لون» (ink): اللون الثانوي هو لون نص المصحف لتلك الخلفية — غامق على الفاتحتين وفاتح على
          // الداكنتين — فيصير التطبيق أحادي اللون
          var accentHex = accent.ink ? bg.ink : bg.dark ? accent.dark : accent.light;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-bg', bg.id);
          root.setAttribute('data-accent', accent.id);
          root.style.setProperty('--bg', bg.bg);
          root.style.setProperty('--ink', bg.ink);
          root.style.setProperty('--accent', accentHex);
          for (var name in k) root.style.setProperty('--k-' + name, k[name] + '%');

          // لون التطبيق للنص والأيقونات (--accent-text): يُغمَّق على الفاتحة ويُفتَّح على الداكنة
          // بخطوات صغيرة حتى يبلغ تباينه ٤٫٥ على كل سطح قد يقع عليه — الخلفية، والبطاقات بدرجاتها
          // الثلاث، والتظليل الخفيف بلون التطبيق (--accent-soft) فوق البطاقة (كرابط الشرح وزر التنزيل
          // النشط). والأزرار والأشرطة والحدود تبقى بـ--accent نفسه.
          var B = rgb(bg.bg), A = rgb(accentHex), layer = bg.dark ? [255, 255, 255] : [0, 0, 0];
          var s2 = mix(B, layer, k['surface-2']);
          var surfaces = [B, mix(B, layer, k.surface), s2, mix(B, layer, k['surface-3']), mix(s2, A, k.soft)];
          var text = A;
          for (var t = 0; t <= 100; t += 2) {
            // مقرَّبًا إلى درجاته الفعلية (٠–٢٥٥) قبل قياسه، كما سيُرسم
            text = mix(A, layer, t).map(Math.round);
            var ok = true;
            for (var i = 0; i < surfaces.length; i++) if (contrast(text, surfaces[i]) < 4.5) ok = false;
            if (ok) break;
          }
          root.style.setProperty('--accent-text', hex(text));

          // ألوان خط المصحف (src/lib/qcfFonts.js، بـoverride-colors): النص ورقم الآية بلون نص المصحف،
          // وزخرفة علامة الآية من لون التطبيق — التاجان باللون نفسه، والتعبئة خلف الرقم درجة منه
          // ممزوجة بالخلفية (أفتح على الفاتحة، أغمق على الداكنة)، والنقطة الصغيرة درجة أغمق منه.
          var colors = {
            ink: bg.ink,
            ornament: accentHex,
            fill: hex(mix(B, A, k['decor-fill'])),
            dot: hex(mix(A, [0, 0, 0], k['decor-dot'])),
          };

          // شريط حالة الجوال بلون الخلفية المختارة
          var meta = document.querySelector('meta[name="theme-color"]');
          if (!meta) {
            meta = document.createElement('meta');
            meta.name = 'theme-color';
            document.head.appendChild(meta);
          }
          meta.content = bg.bg;

          var state = { bg: bg.id, accent: accent.id, colors: colors };
          if (window.hqAppearance) window.hqAppearance.current = state;
          window.dispatchEvent(new CustomEvent('hq:appearance', { detail: state }));
          return state;
        }

        var bgId = get(BG_KEY);
        if (!find(DATA.backgrounds, bgId)) {
          var old = get('hq.theme');
          bgId = old === 'dark' ? DATA.defaults.dark : DATA.defaults.light;
          set(BG_KEY, bgId);
          try { localStorage.removeItem('hq.theme'); } catch (e) {}
        }
        var accentId = get(ACCENT_KEY);
        // لون أُزيل وحلّ محله غيره («موف» ⇐ «بلا لون»، ٢٠٢٦-١١-١٢): ينتقل صاحبه إليه تلقائيًا
        if (DATA.replaced && DATA.replaced[accentId]) {
          accentId = DATA.replaced[accentId];
          set(ACCENT_KEY, accentId);
        }
        if (!find(DATA.accents, accentId)) {
          accentId = DATA.defaults.accent;
          set(ACCENT_KEY, accentId);
        }

        window.hqAppearance = { data: DATA, apply: apply, current: apply(bgId, accentId) };
      })();
    </script>
    <style>
      /* قبل أن يرسم React شيئًا: كحلي بلون شاشة النظام، فلا يومض الأبيض بينها وبين التطبيق */
      #root:empty { position: fixed; inset: 0; background: #1a0165; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
