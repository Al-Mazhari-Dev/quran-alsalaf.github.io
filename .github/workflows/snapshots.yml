# تحديث اللقطات المرجعية في بيئة GitHub نفسها التي تقارن بها (لا على جهاز آخر).
# يعمل حين يُرفع إلى فرع (غير main) التزامٌ في رسالته [update-snapshots]: يلتقط شاشات
# tests/e2e/screens.spec.js من جديد ويرفعها التزامًا على الفرع نفسه، فتُرى فيه الصورة القديمة والجديدة.
# (بحسب CLAUDE.md: لا يُعتمد التحديث قبل أن يرى صاحب المشروع الصورتين)
name: تحديث اللقطات المرجعية

on:
  push:
    branches-ignore: [main]

permissions:
  contents: write

jobs:
  update:
    if: contains(github.event.head_commit.message, '[update-snapshots]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: التقاط اللقطات
        run: npx playwright test tests/e2e/screens.spec.js --update-snapshots=all
        env:
          CI: '1'
      - name: رفع اللقطات الجديدة إلى الفرع
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then echo "لا تغيير في اللقطات"; exit 0; fi
          git commit -m "تحديث اللقطات المرجعية من بيئة GitHub"
          git push
